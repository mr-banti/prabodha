<script>
  // ---- Live local date, 24h time, and timezone in the masthead ----
  function ordinalSuffix(n) {
    const v = n % 100;
    if (v >= 11 && v <= 13) return "th";
    switch (n % 10) {
      case 1: return "st";
      case 2: return "nd";
      case 3: return "rd";
      default: return "th";
    }
  }
  function updateLiveDateTime() {
    const el = document.getElementById("liveDateTime");
    if (!el) return;
    const now = new Date();
    const day = now.getDate();
    const month = now.toLocaleString("en-US", { month: "long" });
    const year = now.getFullYear();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    const ss = String(now.getSeconds()).padStart(2, "0");
    let tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    try {
      const tzShort = new Intl.DateTimeFormat("en-US", { timeZoneName: "short" })
        .formatToParts(now).find(p => p.type === "timeZoneName");
      if (tzShort) tz = `${tz} (${tzShort.value})`;
    } catch (e) {}
    el.textContent = `${day}${ordinalSuffix(day)} ${month} ${year} · ${hh}:${mm}:${ss} · ${tz}`;
  }
  updateLiveDateTime();
  setInterval(updateLiveDateTime, 1000);
  document.getElementById("copyYear").textContent = new Date().getFullYear();

  function renderPageQr() {
    const el = document.getElementById("footQr");
    if (!el || typeof qrcode !== "function") return;
    const link = window.location.href.split("?")[0].split("#")[0];
    const qr = qrcode(0, "M");
    qr.addData(link);
    qr.make();
    el.innerHTML = qr.createSvgTag({ cellSize: 2, margin: 1 });
    el.title = link;
  }
  renderPageQr();

  function toggleTheme() {
    const root = document.documentElement;
    const isDark = root.getAttribute("data-theme") === "dark";
    if (isDark) { root.removeAttribute("data-theme"); localStorage.setItem("prabodha-theme", "light"); }
    else { root.setAttribute("data-theme", "dark"); localStorage.setItem("prabodha-theme", "dark"); }
    updateThemeBtn();
  }
  function updateThemeBtn() {
    const btn = document.getElementById("themeToggle");
    if (!btn) return;
    btn.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀️ " : "🌙 ";
  }
  updateThemeBtn();
</script>
<script>
  const list = document.getElementById("archiveList");
  const stats = document.getElementById("archiveStats");
  const searchInput = document.getElementById("archiveSearch");
  const issues = window.ARCHIVE || [];

  if (stats) {
    const count = issues.length;
    const latest = count ? issues[0].date : "—";
    const first = count ? issues[issues.length - 1].date : "—";
    stats.innerHTML = `
      <div class="stat-block"><div class="stat-num">${count}</div><div class="stat-label">ISSUES PUBLISHED</div></div>
      <div class="stat-block"><div class="stat-num">${latest}</div><div class="stat-label">LATEST ISSUE</div></div>
      <div class="stat-block"><div class="stat-num">${first}</div><div class="stat-label">FIRST PUBLISHED</div></div>
    `;
  }

  // Normalize text for flexible matching: lowercase, collapse punctuation/spaces
  function normalize(s) {
    return (s || "").toLowerCase().replace(/[.,·•|_/\\-]/g, " ").replace(/\s+/g, " ").trim();
  }

  // Build a searchable string per issue from its archive-list metadata:
  // date, issue label, headline, plus normalized "vol"/"issue" tokens.
  function metaText(it) {
    const raw = `${it.date} ${it.issue} ${it.headline}`;
    let norm = normalize(raw);
    norm = norm.replace(/vol\.?\s*/g, "vol ").replace(/issue\s*/g, "issue ");
    return norm;
  }

  // ---- Levenshtein edit distance (for typo-tolerant word matching) ----
  function editDistance(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    const dp = new Array(n + 1);
    for (let j = 0; j <= n; j++) dp[j] = j;
    for (let i = 1; i <= m; i++) {
      let prev = dp[0];
      dp[0] = i;
      for (let j = 1; j <= n; j++) {
        const tmp = dp[j];
        dp[j] = a[i - 1] === b[j - 1] ? prev : 1 + Math.min(prev, dp[j], dp[j - 1]);
        prev = tmp;
      }
    }
    return dp[n];
  }

  // A search term "fuzzy-matches" a text word if it's a substring,
  // or close enough by edit distance (tolerant of small typos).
  function fuzzyIncludes(text, term) {
    if (text.includes(term)) return true;
    if (term.length < 4) return false; // avoid false positives on short words
    const words = text.split(" ");
    const maxDist = term.length <= 6 ? 1 : 2;
    return words.some(w => w.length >= 3 && editDistance(w, term) <= maxDist);
  }

  // ---- Pull full article text out of each issue's own data file ----
  // (headlines, deks/summaries, and body paragraphs across all sections)
  function flattenIssueText(D) {
    if (!D) return "";
    const parts = [];
    const grab = (o, keys) => { if (o) keys.forEach(k => { if (typeof o[k] === "string") parts.push(o[k]); if (Array.isArray(o[k])) parts.push(o[k].join(" ")); }); };
    grab(D, ["motto"]);
    grab(D.lead, ["kicker", "headline", "deck", "dek", "body", "caption"]);
    (D.highlights || []).forEach(h => grab(h, ["tag", "title", "caption", "body"]));
    (D.inBrief || []).forEach(b => grab(b, ["tag", "headline", "body", "fullBody", "caption"]));
    (D.secondary || []).forEach(s => grab(s, ["tag", "headline", "summary", "body", "caption"]));
    grab(D.featured, ["tag", "headline", "dek", "summary", "body"]);
    grab(D.featured2, ["tag", "headline", "dek", "summary", "body"]);
    (D.bottomStrip || []).forEach(b => grab(b, ["tag", "headline", "summary", "body"]));
    if (D.market) parts.push(D.market.note || "");
    return normalize(parts.join(" "));
  }

  // Load an issue's data file in isolation and capture window.ISSUE
  function loadIssueContent(path) {
    return new Promise(resolve => {
      const s = document.createElement("script");
      s.src = path;
      s.onload = () => {
        const data = window.ISSUE;
        delete window.ISSUE;
        s.remove();
        resolve(data);
      };
      s.onerror = () => { s.remove(); resolve(null); };
      document.head.appendChild(s);
    });
  }

  function renderList(filtered) {
    if (!issues.length) {
      list.innerHTML = `<p class="archive-empty">No past issues yet — this month's edition will appear here once it's published.</p>`;
      return;
    }
    if (!filtered.length) {
      list.innerHTML = `<p class="archive-empty">No issues match your search. Try a month, year, "Vol X" / "Issue X", or a word from the news.</p>`;
      return;
    }
    list.innerHTML = filtered.map(it => `
      <a class="archive-row" href="index.html?edition=${encodeURIComponent(it.data)}">
        <div class="archive-date">${it.date}<br><span class="archive-issue">${it.issue}</span></div>
        <div class="archive-headline">${it.headline}</div>
        <div class="archive-arrow">READ →</div>
      </a>
    `).join("");
  }

  renderList(issues);

  // Build a full-text index (meta + article content) for every issue, in the background.
  const contentIndex = new Map(); // it.data -> normalized full text
  const statusEl = document.getElementById("archiveSearchStatus");
  (async () => {
    for (const it of issues) {
      let text = metaText(it);
      const data = await loadIssueContent(it.data);
      if (data) text += " " + flattenIssueText(data);
      contentIndex.set(it.data, text);
    }
    if (statusEl) statusEl.textContent = "";
    if (searchInput && searchInput.value.trim()) runSearch(searchInput.value);
  })();
  if (statusEl) statusEl.textContent = "Indexing articles…";

  function runSearch(rawQuery) {
    const q = normalize(rawQuery);
    if (!q) { renderList(issues); return; }
    const terms = q.split(" ").filter(Boolean);
    const filtered = issues.filter(it => {
      const text = contentIndex.get(it.data) || metaText(it);
      return terms.every(term => fuzzyIncludes(text, term));
    });
    renderList(filtered);
  }

  if (searchInput) {
    let debounceTimer;
    searchInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => runSearch(searchInput.value), 120);
    });
  }
</script>
